<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130d25"><title>Ghost Pop! 👻 | Ellen's Halloween</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Baloo 2",system-ui,sans-serif;background:#130d25;color:#fff2df}body{background:radial-gradient(circle at 85% 12%,#ffc976 0 4%,transparent 4.6%),linear-gradient(150deg,#130d25,#42275b 75%,#632e50);min-height:100dvh}
.wrap{width:min(860px,96vw);margin:0 auto;padding:12px 0 22px}.back{display:inline-block;color:#271435;text-decoration:none;background:#ffc077;border-radius:999px;padding:7px 15px;font-weight:800}
h1{text-align:center;font-size:clamp(2.3rem,9vw,4.5rem);margin:4px 0 0;line-height:1.1;text-shadow:0 5px #aa4d21}.intro{text-align:center;margin:2px 0 12px}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.stat{background:#fbe6ff;color:#2c1b40;border-radius:14px;padding:5px 18px;min-width:95px;text-align:center;border:2px solid #e4a0ff;font-weight:800}.stat strong{display:block;font-size:1.35rem;line-height:1.1}
.arena{position:relative;overflow:hidden;isolation:isolate;height:clamp(360px,58dvh,600px);border:4px solid #f6a94e;border-radius:25px;background:radial-gradient(circle at 80% 18%,#fff4ba 0 6%,#ffcf8880 6.3%,transparent 13%),linear-gradient(#241b48,#543a65 65%,#34273d);box-shadow:0 8px 0 #7f3b58;touch-action:manipulation}
.arena:before{content:"🦇　　　　🦇";position:absolute;top:8%;left:10%;font-size:22px;opacity:.6;pointer-events:none}
.arena:after{content:"🎃　🌲　🪦　🌲　🎃";position:absolute;bottom:-12px;left:0;width:100%;text-align:center;letter-spacing:1.2vw;font-size:clamp(36px,7vw,65px);pointer-events:none;opacity:.75}
.ghost{position:absolute;left:0;bottom:-95px;width:70px;height:75px;border:0;background:transparent;font-size:54px;line-height:1;cursor:pointer;touch-action:manipulation;z-index:2;filter:drop-shadow(0 6px 8px #0007);animation:floatUp var(--speed) linear forwards;will-change:transform;display:grid;place-items:center;padding:4px}
.ghost:focus-visible{outline:3px solid #ffc65b;border-radius:50%}.ghost:active{scale:.92}
@keyframes floatUp{from{transform:translate3d(0,0,0) rotate(-9deg)}50%{transform:translate3d(var(--sway),calc(-1 * var(--distance) / 2),0) rotate(8deg)}to{transform:translate3d(calc(var(--sway) * -.4),calc(-1 * var(--distance)),0) rotate(-8deg)}}
.pop{position:absolute;z-index:4;pointer-events:none;font-size:30px;font-weight:800;color:#ffe38a;animation:pop .65s forwards}
@keyframes pop{to{transform:translateY(-60px) scale(1.5);opacity:0}}
.overlay{position:absolute;inset:0;z-index:8;background:#140e29dd;display:grid;place-content:center;text-align:center;padding:24px;gap:8px}.overlay[hidden]{display:none}.overlay h2{font-size:clamp(2rem,7vw,3.5rem);margin:0}.overlay p{max-width:340px;margin:0 auto 8px}.start{font:800 1.3rem "Baloo 2",sans-serif;background:#ff983d;color:#24142e;border:3px solid #fff0c9;border-radius:20px;padding:10px 30px;cursor:pointer;box-shadow:0 5px 0 #8f4227}.start:active{transform:translateY(3px);box-shadow:none}
.tip{text-align:center;font-size:.9rem;opacity:.85;margin:13px 0 0}@media(prefers-reduced-motion:reduce){.ghost{animation-duration:10s!important}}
</style></head><body><div class="wrap"><a href="index.html" class="back">← Ellen's haunted home</a><h1>👻 Ghost Pop!</h1><p class="intro">Tap the floating ghosts before they escape. You have 30 seconds!</p><div class="stats"><div class="stat">SCORE<strong id="score">0</strong></div><div class="stat">TIME<strong id="time">30</strong></div><div class="stat">BEST<strong id="best">0</strong></div></div>
<main id="arena" class="arena" aria-label="Ghost popping game"><div id="overlay" class="overlay"><h2 id="headline">Ready to haunt? 🎃</h2><p id="message">Pop as many ghosts as you can in 30 seconds. Each ghost scores one point!</p><button id="start" class="start">Start popping!</button></div></main><p class="tip">Works with taps, clicks, or keyboard. Ghosts get faster as you score!</p></div>
<script>
(()=>{const arena=document.getElementById("arena"),overlay=document.getElementById("overlay"),start=document.getElementById("start"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best"),headline=document.getElementById("headline"),message=document.getElementById("message");let score=0,remaining=30,best=0,active=false,spawnTimer=null,clock=null,ghosts=new Set();try{best=Number(localStorage.getItem("ellenGhostBest"))||0}catch(e){}bestEl.textContent=best;
function clearGhosts(){ghosts.forEach(g=>g.remove());ghosts.clear()}
function spawn(){if(!active)return;const g=document.createElement("button");g.className="ghost";g.type="button";g.textContent="👻";g.setAttribute("aria-label","Pop ghost");const width=arena.clientWidth,height=arena.clientHeight;g.style.left=Math.max(0,Math.random()*(width-76))+"px";g.style.setProperty("--sway",(Math.random()*110-55)+"px");g.style.setProperty("--distance",(height+135)+"px");const duration=Math.max(2.3,5.6-score*.045)+Math.random()*1.1;g.style.setProperty("--speed",duration+"s");arena.appendChild(g);ghosts.add(g);
g.addEventListener("click",()=>{if(!active||!ghosts.has(g))return;score++;scoreEl.textContent=score;const p=document.createElement("span");p.className="pop";p.textContent=["✨ POP!","💥 +1","⭐ BOO!"][Math.floor(Math.random()*3)];p.style.left=g.style.left;p.style.top=Math.max(0,g.offsetTop-10)+"px";arena.appendChild(p);setTimeout(()=>p.remove(),700);g.remove();ghosts.delete(g)});
g.addEventListener("animationend",()=>{g.remove();ghosts.delete(g)});}
function schedule(){if(!active)return;spawn();spawnTimer=setTimeout(schedule,Math.max(290,760-score*10))}
function finish(){active=false;clearInterval(clock);clearTimeout(spawnTimer);clearGhosts();if(score>best){best=score;try{localStorage.setItem("ellenGhostBest",String(best))}catch(e){}}bestEl.textContent=best;headline.textContent=score>=25?"Ghostbuster legend! 🏆":score>=12?"Spook-tacular! 🎃":"Boo-tiful effort! 👻";message.textContent="You popped "+score+" ghosts! Best score: "+best+".";start.textContent="Play again";overlay.hidden=false}
function begin(){clearInterval(clock);clearTimeout(spawnTimer);clearGhosts();score=0;remaining=30;scoreEl.textContent=0;timeEl.textContent=30;overlay.hidden=true;active=true;schedule();clock=setInterval(()=>{remaining--;timeEl.textContent=remaining;if(remaining<=0)finish()},1000)}
start.addEventListener("click",begin);document.addEventListener("visibilitychange",()=>{if(document.hidden&&active)finish()});
})();
</script></body></html>
