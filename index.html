<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff5fa2" />
  <title>Ellen Is Wanted!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');

    :root {
      --pink: #ff4f9a;
      --purple: #8d5cff;
      --yellow: #ffe46b;
      --ink: #3d3153;
      --skin: #ffd7bc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: "Baloo 2", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, #fff4a8 0 5%, transparent 6%),
        radial-gradient(circle at 82% 16%, #ffc6e2 0 6%, transparent 7%),
        linear-gradient(145deg, #fff5fb 0%, #e7ddff 52%, #ccefff 100%);
    }

    .sparkles,
    .sparkles::before,
    .sparkles::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(circle, #fff 0 3px, transparent 4px),
        radial-gradient(circle, #ffdb4d 0 4px, transparent 5px);
      background-position: 12% 30%, 88% 72%;
      background-size: 170px 170px, 230px 230px;
      animation: drift 8s linear infinite;
      opacity: .75;
    }

    .sparkles::before { transform: rotate(40deg); }
    .sparkles::after { transform: rotate(-35deg); animation-direction: reverse; }


    .background-fun {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sun {
      position: absolute;
      top: 5%;
      right: 7%;
      width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffe66d;
      box-shadow: 0 0 0 14px rgba(255,230,109,.22), 0 0 45px #fff3a6;
      animation: sunPulse 2s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      width: 115px;
      height: 38px;
      border-radius: 40px;
      background: rgba(255,255,255,.82);
      filter: drop-shadow(0 8px 7px rgba(91,71,132,.08));
      animation: cloudCruise linear infinite;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      bottom: 12px;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before { left: 18px; width: 48px; height: 48px; }
    .cloud::after { right: 15px; width: 59px; height: 59px; }
    .cloud.one { top: 17%; left: -140px; animation-duration: 18s; }
    .cloud.two { top: 57%; left: -170px; transform: scale(.7); animation-duration: 24s; animation-delay: -9s; opacity: .7; }
    .cloud.three { top: 81%; left: -150px; transform: scale(.9); animation-duration: 21s; animation-delay: -4s; opacity: .62; }

    .rainbow {
      position: absolute;
      left: -75px;
      bottom: -75px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff5d8f, #ff5d8f 8%, #ffd166 8% 16%, #69db7c 16% 24%, #4dabf7 24% 32%, #9b5de5 32% 40%, transparent 40% 100%);
      opacity: .7;
      animation: rainbowRock 4s ease-in-out infinite;
    }

    .balloon {
      position: absolute;
      bottom: -110px;
      width: 45px;
      height: 56px;
      border-radius: 50% 50% 48% 48%;
      background: var(--balloon);
      box-shadow: inset -8px -8px 0 rgba(80,45,100,.12);
      animation: balloonRise var(--speed) linear infinite;
      animation-delay: var(--delay);
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 18px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 9px solid var(--balloon);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 64px;
      left: 22px;
      width: 1px;
      height: 74px;
      background: rgba(61,49,83,.42);
    }

    .balloon.b1 { left: 7%; --balloon:#ff6b9d; --speed:11s; --delay:-2s; }
    .balloon.b2 { left: 87%; --balloon:#7c65ff; --speed:14s; --delay:-7s; transform:scale(.8); }
    .balloon.b3 { left: 22%; --balloon:#4dd9c0; --speed:16s; --delay:-12s; transform:scale(.65); }
    .balloon.b4 { left: 72%; --balloon:#ffc857; --speed:13s; --delay:-4s; transform:scale(.7); }

    .floater {
      position: absolute;
      left: var(--x);
      bottom: -60px;
      font-size: var(--size);
      animation: emojiFloat var(--speed) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 5px 4px rgba(61,49,83,.15));
    }

    .shooting-star {
      position: absolute;
      top: -30px;
      left: -120px;
      width: 95px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, white, #ffe66d);
      transform: rotate(-24deg);
      animation: shoot 5s ease-in infinite;
    }

    .confetti {
      position: fixed;
      top: -18px;
      left: var(--left);
      width: 10px;
      height: 16px;
      border-radius: 3px;
      background: var(--color);
      z-index: 0;
      animation: confettiFall var(--fall) linear forwards;
    }

    @keyframes sunPulse {
      50% { transform: scale(1.12) rotate(10deg); box-shadow: 0 0 0 21px rgba(255,230,109,.15), 0 0 60px #fff3a6; }
    }

    @keyframes cloudCruise {
      to { left: calc(100% + 170px); }
    }

    @keyframes rainbowRock {
      50% { transform: rotate(7deg) scale(1.05); }
    }

    @keyframes balloonRise {
      0% { translate: 0 0; rotate: -4deg; }
      50% { translate: 22px -55vh; rotate: 5deg; }
      100% { translate: -12px -125vh; rotate: -4deg; }
    }

    @keyframes emojiFloat {
      0% { transform: translateY(0) rotate(-10deg) scale(.75); opacity: 0; }
      12% { opacity: .8; }
      55% { transform: translateY(-60vh) translateX(25px) rotate(12deg) scale(1); }
      100% { transform: translateY(-120vh) translateX(-18px) rotate(-8deg) scale(.8); opacity: 0; }
    }

    @keyframes shoot {
      0%, 63% { transform: translate(-20vw,-10vh) rotate(-24deg); opacity: 0; }
      68% { opacity: 1; }
      82%, 100% { transform: translate(130vw,72vh) rotate(-24deg); opacity: 0; }
    }

    @keyframes confettiFall {
      to { transform: translate3d(var(--sway),110vh,0) rotate(780deg); opacity: .2; }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      padding: clamp(26px, 5vw, 52px) 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(3rem, 11vw, 7rem);
      line-height: .92;
      letter-spacing: -.045em;
      color: white;
      -webkit-text-stroke: clamp(2px, .4vw, 4px) var(--ink);
      paint-order: stroke fill;
      text-shadow:
        0 7px 0 var(--pink),
        0 12px 0 var(--purple),
        0 18px 24px rgba(62, 42, 97, .25);
      animation: lightUp 1s steps(1, end) infinite, bounce 2s ease-in-out infinite;
    }

    .girl {
      position: relative;
      width: 220px;
      height: 300px;
      margin: 16px auto 0;
      filter: drop-shadow(0 14px 10px rgba(61, 49, 83, .18));
    }

    .head {
      position: absolute;
      top: 18px;
      left: 72px;
      width: 78px;
      height: 78px;
      border: 7px solid var(--ink);
      border-radius: 50%;
      background: var(--skin);
      z-index: 3;
    }

    .hair {
      position: absolute;
      top: 7px;
      left: 61px;
      width: 101px;
      height: 67px;
      border-radius: 52px 52px 26px 26px;
      background: #f4c95d;
      transform: rotate(-3deg);
      z-index: 2;
    }

    .hair::before,
    .hair::after {
      content: "";
      position: absolute;
      top: 36px;
      width: 22px;
      height: 72px;
      background: #f4c95d;
      border-radius: 50%;
    }

    .hair::before { left: 2px; transform: rotate(10deg); }
    .hair::after { right: 2px; transform: rotate(-10deg); }

    .eye {
      position: absolute;
      top: 31px;
      width: 8px;
      height: 11px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 19px; }
    .eye.right { right: 19px; }

    .mouth {
      position: absolute;
      left: 25px;
      top: 49px;
      width: 28px;
      height: 13px;
      border-bottom: 5px solid var(--pink);
      border-radius: 0 0 50% 50%;
    }

    .dress {
      position: absolute;
      top: 105px;
      left: 64px;
      width: 94px;
      height: 116px;
      clip-path: polygon(31% 0, 69% 0, 100% 100%, 0 100%);
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-radius: 18px;
      z-index: 2;
    }

    .neck {
      position: absolute;
      top: 91px;
      left: 103px;
      width: 18px;
      height: 24px;
      border-radius: 8px;
      background: var(--skin);
    }

    .arm {
      position: absolute;
      top: 118px;
      width: 10px;
      height: 96px;
      border-radius: 8px;
      background: var(--ink);
      transform-origin: 50% 8px;
      z-index: 1;
    }

    .arm.left { left: 70px; transform: rotate(22deg); }

    .arm.wave {
      left: 145px;
      animation: wave .65s ease-in-out infinite alternate;
    }

    .hand {
      position: absolute;
      left: -5px;
      bottom: -9px;
      width: 20px;
      height: 20px;
      border: 5px solid var(--ink);
      border-radius: 50%;
      background: var(--skin);
    }

    .leg {
      position: absolute;
      top: 211px;
      width: 10px;
      height: 76px;
      border-radius: 8px;
      background: var(--ink);
      transform-origin: top center;
    }

    .leg.left { left: 91px; transform: rotate(7deg); }
    .leg.right { left: 123px; transform: rotate(-7deg); }

    .shoe {
      position: absolute;
      bottom: -2px;
      left: -9px;
      width: 31px;
      height: 14px;
      border-radius: 12px 12px 5px 5px;
      background: var(--pink);
    }

    .heart {
      position: absolute;
      top: 76px;
      right: 8px;
      font-size: 38px;
      animation: floatHeart 1.2s ease-in-out infinite;
    }

    .ground {
      width: 190px;
      height: 18px;
      margin: -4px auto 0;
      border-radius: 50%;
      background: rgba(61, 49, 83, .14);
    }

    @keyframes lightUp {
      0%, 49% {
        color: #fff;
        text-shadow: 0 7px 0 var(--pink), 0 12px 0 var(--purple), 0 0 18px #fff, 0 0 42px var(--yellow);
      }
      50%, 100% {
        color: var(--yellow);
        text-shadow: 0 7px 0 var(--purple), 0 12px 0 var(--pink), 0 0 24px #fff, 0 0 54px var(--pink);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    @keyframes wave {
      from { transform: rotate(-128deg); }
      to { transform: rotate(-168deg); }
    }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(2px) rotate(-8deg) scale(.9); }
      50% { transform: translateY(-12px) rotate(8deg) scale(1.12); }
    }

    @keyframes drift {
      to { background-position: 182% 130%, -142% -130%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>
  <div class="background-fun" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>
    <div class="rainbow"></div>
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="floater" style="--x:12%;--size:30px;--speed:10s;--delay:-4s">💖</div>
    <div class="floater" style="--x:34%;--size:27px;--speed:13s;--delay:-9s">⭐</div>
    <div class="floater" style="--x:64%;--size:31px;--speed:12s;--delay:-2s">🌸</div>
    <div class="floater" style="--x:91%;--size:34px;--speed:15s;--delay:-11s">🦋</div>
    <div class="shooting-star"></div>
  </div>
  <main>
    <h1>Ellen Is<br />Wanted!</h1>
    <div class="girl" role="img" aria-label="A cute stick figure girl waving">
      <div class="hair"></div>
      <div class="head">
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="mouth"></span>
      </div>
      <div class="neck"></div>
      <div class="dress"></div>
      <div class="arm left"><span class="hand"></span></div>
      <div class="arm wave"><span class="hand"></span></div>
      <div class="leg left"><span class="shoe"></span></div>
      <div class="leg right"><span class="shoe"></span></div>
      <div class="heart">💖</div>
    </div>
    <div class="ground" aria-hidden="true"></div>
  </main>
  <script>
    const colors = ["#ff4f9a", "#8d5cff", "#ffe46b", "#4dd9c0", "#4dabf7"];
    function confettiBurst() {
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.setProperty("--left", Math.random() * 100 + "vw");
        piece.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
        piece.style.setProperty("--fall", (3 + Math.random() * 3) + "s");
        piece.style.setProperty("--sway", (-80 + Math.random() * 160) + "px");
        piece.style.animationDelay = Math.random() * .7 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 7000);
      }
    }
    confettiBurst();
    setInterval(confettiBurst, 4000);
    document.addEventListener("pointerdown", confettiBurst);
  </script>
</body>
</html>
