<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff5fa2" />
  <title>Ellen Is Wanted!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');

    :root {
      --pink: #ff4f9a;
      --purple: #8d5cff;
      --yellow: #ffe46b;
      --ink: #3d3153;
      --skin: #ffd7bc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: "Baloo 2", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, #fff4a8 0 5%, transparent 6%),
        radial-gradient(circle at 82% 16%, #ffc6e2 0 6%, transparent 7%),
        linear-gradient(145deg, #fff5fb 0%, #e7ddff 52%, #ccefff 100%);
    }

    .sparkles,
    .sparkles::before,
    .sparkles::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(circle, #fff 0 3px, transparent 4px),
        radial-gradient(circle, #ffdb4d 0 4px, transparent 5px);
      background-position: 12% 30%, 88% 72%;
      background-size: 170px 170px, 230px 230px;
      animation: drift 8s linear infinite;
      opacity: .75;
    }

    .sparkles::before { transform: rotate(40deg); }
    .sparkles::after { transform: rotate(-35deg); animation-direction: reverse; }


    .background-fun {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sun {
      position: absolute;
      top: 5%;
      right: 7%;
      width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffe66d;
      box-shadow: 0 0 0 14px rgba(255,230,109,.22), 0 0 45px #fff3a6;
      animation: sunPulse 2s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      width: 115px;
      height: 38px;
      border-radius: 40px;
      background: rgba(255,255,255,.82);
      filter: drop-shadow(0 8px 7px rgba(91,71,132,.08));
      animation: cloudCruise linear infinite;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      bottom: 12px;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before { left: 18px; width: 48px; height: 48px; }
    .cloud::after { right: 15px; width: 59px; height: 59px; }
    .cloud.one { top: 17%; left: -140px; animation-duration: 18s; }
    .cloud.two { top: 57%; left: -170px; transform: scale(.7); animation-duration: 24s; animation-delay: -9s; opacity: .7; }
    .cloud.three { top: 81%; left: -150px; transform: scale(.9); animation-duration: 21s; animation-delay: -4s; opacity: .62; }

    .rainbow {
      cursor: pointer;
      pointer-events: auto;
      z-index: 5;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: absolute;
      left: -75px;
      bottom: -75px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff5d8f, #ff5d8f 8%, #ffd166 8% 16%, #69db7c 16% 24%, #4dabf7 24% 32%, #9b5de5 32% 40%, transparent 40% 100%);
      opacity: .7;
      animation: rainbowRock 4s ease-in-out infinite;
    }

    .rainbow::after {
      content: "Tap the rainbow for fun pictures!";
      position: absolute;
      left: 70px;
      top: 30px;
      width: 150px;
      padding: 7px 10px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      box-shadow: 0 4px 0 rgba(61,49,83,.16);
    }

    .balloon {
      position: absolute;
      bottom: -110px;
      width: 45px;
      height: 56px;
      border-radius: 50% 50% 48% 48%;
      background: var(--balloon);
      box-shadow: inset -8px -8px 0 rgba(80,45,100,.12);
      animation: balloonRise var(--speed) linear infinite;
      animation-delay: var(--delay);
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 18px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 9px solid var(--balloon);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 64px;
      left: 22px;
      width: 1px;
      height: 74px;
      background: rgba(61,49,83,.42);
    }

    .balloon.b1 { left: 7%; --balloon:#ff6b9d; --speed:11s; --delay:-2s; }
    .balloon.b2 { left: 87%; --balloon:#7c65ff; --speed:14s; --delay:-7s; transform:scale(.8); }
    .balloon.b3 { left: 22%; --balloon:#4dd9c0; --speed:16s; --delay:-12s; transform:scale(.65); }
    .balloon.b4 { left: 72%; --balloon:#ffc857; --speed:13s; --delay:-4s; transform:scale(.7); }

    .floater {
      position: absolute;
      left: var(--x);
      bottom: -60px;
      font-size: var(--size);
      animation: emojiFloat var(--speed) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 5px 4px rgba(61,49,83,.15));
    }


    .phrase {
      position: absolute;
      left: var(--x);
      bottom: -80px;
      max-width: 190px;
      padding: 8px 15px;
      color: var(--ink);
      font-size: clamp(1rem, 2.6vw, 1.45rem);
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      border: 3px solid rgba(61,49,83,.7);
      border-radius: 999px;
      background: var(--bubble);
      box-shadow: 0 6px 0 rgba(61,49,83,.14), 0 10px 20px rgba(61,49,83,.12);
      opacity: 0;
      animation: phraseRise var(--speed) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes phraseRise {
      0% { transform: translate3d(0,0,0) rotate(-5deg) scale(.82); opacity: 0; }
      10% { opacity: .88; }
      45% { transform: translate3d(var(--drift),-55vh,0) rotate(4deg) scale(1); opacity: .88; }
      90% { opacity: .82; }
      100% { transform: translate3d(calc(var(--drift) * -.5),-120vh,0) rotate(-4deg) scale(.88); opacity: 0; }
    }

    .shooting-star {
      position: absolute;
      top: -30px;
      left: -120px;
      width: 95px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, white, #ffe66d);
      transform: rotate(-24deg);
      animation: shoot 5s ease-in infinite;
    }

    .confetti {
      position: fixed;
      top: -18px;
      left: var(--left);
      width: 10px;
      height: 16px;
      border-radius: 3px;
      background: var(--color);
      z-index: 0;
      animation: confettiFall var(--fall) linear forwards;
    }

    @keyframes sunPulse {
      50% { transform: scale(1.12) rotate(10deg); box-shadow: 0 0 0 21px rgba(255,230,109,.15), 0 0 60px #fff3a6; }
    }

    @keyframes cloudCruise {
      to { left: calc(100% + 170px); }
    }

    @keyframes rainbowRock {
      50% { transform: rotate(7deg) scale(1.05); }
    }

    @keyframes balloonRise {
      0% { translate: 0 0; rotate: -4deg; }
      50% { translate: 22px -55vh; rotate: 5deg; }
      100% { translate: -12px -125vh; rotate: -4deg; }
    }

    @keyframes emojiFloat {
      0% { transform: translateY(0) rotate(-10deg) scale(.75); opacity: 0; }
      12% { opacity: .8; }
      55% { transform: translateY(-60vh) translateX(25px) rotate(12deg) scale(1); }
      100% { transform: translateY(-120vh) translateX(-18px) rotate(-8deg) scale(.8); opacity: 0; }
    }

    @keyframes shoot {
      0%, 63% { transform: translate(-20vw,-10vh) rotate(-24deg); opacity: 0; }
      68% { opacity: 1; }
      82%, 100% { transform: translate(130vw,72vh) rotate(-24deg); opacity: 0; }
    }

    @keyframes confettiFall {
      to { transform: translate3d(var(--sway),110vh,0) rotate(780deg); opacity: .2; }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      padding: clamp(26px, 5vw, 52px) 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(3rem, 11vw, 7rem);
      line-height: .92;
      letter-spacing: -.045em;
      color: white;
      -webkit-text-stroke: clamp(2px, .4vw, 4px) var(--ink);
      paint-order: stroke fill;
      text-shadow:
        0 7px 0 var(--pink),
        0 12px 0 var(--purple),
        0 18px 24px rgba(62, 42, 97, .25);
      animation: lightUp 1s steps(1, end) infinite, bounce 2s ease-in-out infinite;
    }

    .girl {
      position: relative;
      width: 220px;
      height: 300px;
      margin: 16px auto 0;
      filter: drop-shadow(0 14px 10px rgba(61, 49, 83, .18));
    }

    .head {
      position: absolute;
      top: 18px;
      left: 72px;
      width: 78px;
      height: 78px;
      border: 7px solid var(--ink);
      border-radius: 50%;
      background: var(--skin);
      z-index: 3;
    }

    .hair {
      position: absolute;
      top: 7px;
      left: 61px;
      width: 101px;
      height: 67px;
      border-radius: 52px 52px 26px 26px;
      background: #f4c95d;
      transform: rotate(-3deg);
      z-index: 2;
    }

    .hair::before,
    .hair::after {
      content: "";
      position: absolute;
      top: 36px;
      width: 22px;
      height: 72px;
      background: #f4c95d;
      border-radius: 50%;
    }

    .hair::before { left: 2px; transform: rotate(10deg); }
    .hair::after { right: 2px; transform: rotate(-10deg); }

    .eye {
      position: absolute;
      top: 31px;
      width: 8px;
      height: 11px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 19px; }
    .eye.right { right: 19px; }

    .mouth {
      position: absolute;
      left: 25px;
      top: 49px;
      width: 28px;
      height: 13px;
      border-bottom: 5px solid var(--pink);
      border-radius: 0 0 50% 50%;
    }

    .dress {
      position: absolute;
      top: 105px;
      left: 64px;
      width: 94px;
      height: 116px;
      clip-path: polygon(31% 0, 69% 0, 100% 100%, 0 100%);
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-radius: 18px;
      z-index: 2;
    }

    .neck {
      position: absolute;
      top: 91px;
      left: 103px;
      width: 18px;
      height: 24px;
      border-radius: 8px;
      background: var(--skin);
    }

    .arm {
      position: absolute;
      top: 118px;
      width: 10px;
      height: 96px;
      border-radius: 8px;
      background: var(--ink);
      transform-origin: 50% 8px;
      z-index: 1;
    }

    .arm.left { left: 70px; transform: rotate(22deg); }

    .arm.wave {
      left: 145px;
      animation: wave .65s ease-in-out infinite alternate;
    }

    .hand {
      position: absolute;
      left: -5px;
      bottom: -9px;
      width: 20px;
      height: 20px;
      border: 5px solid var(--ink);
      border-radius: 50%;
      background: var(--skin);
    }

    .leg {
      position: absolute;
      top: 211px;
      width: 10px;
      height: 76px;
      border-radius: 8px;
      background: var(--ink);
      transform-origin: top center;
    }

    .leg.left { left: 91px; transform: rotate(7deg); }
    .leg.right { left: 123px; transform: rotate(-7deg); }

    .shoe {
      position: absolute;
      bottom: -2px;
      left: -9px;
      width: 31px;
      height: 14px;
      border-radius: 12px 12px 5px 5px;
      background: var(--pink);
    }

    .heart {
      position: absolute;
      top: 76px;
      right: 8px;
      font-size: 38px;
      animation: floatHeart 1.2s ease-in-out infinite;
    }


    .dog {
      cursor: pointer;
      position: absolute;
      top: 166px;
      left: 164px;
      width: 150px;
      height: 128px;
      z-index: 4;
      transform-origin: bottom center;
      animation: dogBounce 1.8s ease-in-out infinite;
      filter: drop-shadow(0 10px 7px rgba(61,49,83,.18));
    }

    .dog::after {
      content: "Tap me for Portland fun!";
      position: absolute;
      left: -26px;
      top: -34px;
      width: max-content;
      padding: 6px 10px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      box-shadow: 0 4px 0 rgba(61,49,83,.16);
      animation: hintPop 2.2s ease-in-out infinite;
    }

    @keyframes hintPop {
      0%, 100% { transform: translateY(0) scale(.96); }
      50% { transform: translateY(-5px) scale(1.03); }
    }

    .dog-body {
      position: absolute;
      left: 27px;
      top: 48px;
      width: 103px;
      height: 62px;
      border: 5px solid var(--ink);
      border-radius: 52% 48% 43% 48%;
      background: linear-gradient(145deg, #25242b 0%, #09090c 72%);
    }

    .dog-chest {
      position: absolute;
      left: 30px;
      top: 69px;
      width: 31px;
      height: 34px;
      border-radius: 48%;
      background: #bd8149;
      transform: rotate(-14deg);
      opacity: .88;
    }

    .dog-head {
      position: absolute;
      left: 4px;
      top: 19px;
      width: 72px;
      height: 67px;
      border: 5px solid var(--ink);
      border-radius: 46% 51% 48% 52%;
      background: linear-gradient(145deg, #29282e, #09090c 70%);
      transform-origin: 60% 80%;
      animation: dogTilt 3.6s ease-in-out infinite;
      z-index: 5;
    }

    .dog-ear {
      position: absolute;
      top: -14px;
      width: 29px;
      height: 43px;
      border: 5px solid var(--ink);
      background: #15151a;
      z-index: -1;
    }

    .dog-ear.left {
      left: -12px;
      border-radius: 70% 22% 55% 35%;
      transform: rotate(-28deg);
      animation: earFlop 2.4s ease-in-out infinite;
    }

    .dog-ear.right {
      right: -10px;
      border-radius: 22% 70% 35% 55%;
      transform: rotate(28deg);
      animation: earFlop 2.4s .2s ease-in-out infinite reverse;
    }

    .dog-brow {
      position: absolute;
      top: 18px;
      width: 12px;
      height: 8px;
      border-radius: 50%;
      background: #c58a50;
    }

    .dog-brow.left { left: 13px; transform: rotate(10deg); }
    .dog-brow.right { right: 13px; transform: rotate(-10deg); }

    .dog-eye {
      position: absolute;
      top: 29px;
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 -4px 0 #4b2b19;
      animation: dogBlink 4s infinite;
    }

    .dog-eye.left { left: 17px; }
    .dog-eye.right { right: 17px; }

    .dog-muzzle {
      position: absolute;
      left: 17px;
      bottom: 4px;
      width: 41px;
      height: 25px;
      border-radius: 48% 48% 55% 55%;
      background: #af7645;
    }

    .dog-nose {
      position: absolute;
      left: 13px;
      top: 1px;
      width: 16px;
      height: 11px;
      border-radius: 55% 55% 65% 65%;
      background: #111116;
    }

    .dog-smile {
      position: absolute;
      left: 10px;
      top: 12px;
      width: 22px;
      height: 8px;
      border-bottom: 3px solid #3d251c;
      border-radius: 50%;
    }

    .dog-tongue {
      position: absolute;
      left: 13px;
      top: 17px;
      width: 16px;
      height: 19px;
      border: 2px solid #7f3553;
      border-radius: 4px 4px 10px 10px;
      background: #ff7fa8;
      transform-origin: top center;
      animation: tonguePop 3s ease-in-out infinite;
    }

    .dog-collar {
      position: absolute;
      left: 17px;
      top: 76px;
      width: 58px;
      height: 12px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: #2787e8;
      transform: rotate(5deg);
      z-index: 6;
    }

    .dog-tag {
      position: absolute;
      left: 37px;
      top: 85px;
      width: 16px;
      height: 16px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #52d8bd;
      z-index: 7;
    }

    .dog-leg {
      position: absolute;
      top: 91px;
      width: 20px;
      height: 36px;
      border: 4px solid var(--ink);
      border-radius: 9px 9px 12px 12px;
      background: linear-gradient(#17171b 0 37%, #c1884f 38%);
      z-index: 3;
    }

    .dog-leg.front { left: 36px; }
    .dog-leg.front.rear { left: 61px; top: 88px; height: 34px; z-index: 1; }
    .dog-leg.back { right: 23px; }
    .dog-leg.back.rear { right: 43px; top: 88px; height: 34px; z-index: 1; }

    .dog-paw {
      position: absolute;
      left: -5px;
      bottom: -4px;
      width: 27px;
      height: 13px;
      border: 4px solid var(--ink);
      border-radius: 50% 55% 42% 45%;
      background: #c1884f;
    }

    .dog-tail {
      position: absolute;
      right: -19px;
      top: 54px;
      width: 62px;
      height: 16px;
      border: 5px solid var(--ink);
      border-left: 0;
      border-radius: 0 90% 20% 0;
      background: #121217;
      transform-origin: left center;
      animation: tailWag .32s ease-in-out infinite alternate;
      z-index: -1;
    }

    .dog-heart {
      position: absolute;
      right: -6px;
      top: 7px;
      font-size: 22px;
      animation: floatHeart 1.4s .3s ease-in-out infinite;
    }

    @keyframes dogBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }

    @keyframes dogTilt {
      0%, 42%, 100% { transform: rotate(0); }
      50%, 68% { transform: rotate(-9deg); }
    }

    @keyframes tailWag {
      from { transform: rotate(-25deg); }
      to { transform: rotate(24deg); }
    }

    @keyframes earFlop {
      0%, 75%, 100% { translate: 0 0; }
      82% { translate: 0 3px; }
    }

    @keyframes dogBlink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.1); }
    }

    @keyframes tonguePop {
      0%, 36%, 100% { transform: scaleY(.15); opacity: 0; }
      42%, 75% { transform: scaleY(1); opacity: 1; }
      82% { transform: scaleY(.15); opacity: 0; }
    }

    @media (max-width: 430px) {
      .dog { left: 145px; transform: scale(.88); }
  

    /* Little basketball scene tucked into the background */
    .hoops-scene {
      position: fixed;
      z-index: 0;
      left: clamp(8px, 4vw, 58px);
      top: clamp(12px, 3vh, 34px);
      width: 250px;
      height: 205px;
      pointer-events: none;
      opacity: .82;
      transform: scale(.92);
      transform-origin: top left;
    }
    .hoops-ground { position:absolute; bottom:0; left:8px; width:230px; height:17px; border-radius:50%; background:rgba(61,49,83,.14); }
    .hoop-pole { position:absolute; right:40px; bottom:13px; width:8px; height:140px; border-radius:8px; background:#725b89; }
    .hoop-base { position:absolute; right:24px; bottom:5px; width:42px; height:12px; border-radius:50%; background:#725b89; }
    .hoop-backboard { position:absolute; right:21px; top:18px; width:54px; height:39px; border:5px solid #725b89; border-radius:7px; background:rgba(255,255,255,.7); }
    .hoop-rim { position:absolute; right:61px; top:52px; width:37px; height:7px; border:3px solid #ff765f; border-top:0; border-radius:0 0 50% 50%; }
    .hoop-net { position:absolute; right:67px; top:59px; width:26px; height:32px; border:2px solid rgba(114,91,137,.7); border-top:0; clip-path:polygon(0 0,100% 0,78% 100%,22% 100%); background:repeating-linear-gradient(60deg,transparent 0 7px,rgba(114,91,137,.62) 7px 9px),repeating-linear-gradient(-60deg,transparent 0 7px,rgba(114,91,137,.62) 7px 9px); }
    .hoops-player { position:absolute; left:49px; bottom:14px; width:92px; height:160px; animation:playerSway 2.8s ease-in-out infinite; }
    .player-head { position:absolute; left:28px; top:5px; width:34px; height:34px; border:4px solid var(--ink); border-radius:50%; background:#f0bd98; }
    .player-hair { position:absolute; left:27px; top:2px; width:37px; height:15px; border-radius:20px 20px 8px 8px; background:#49382f; }
    .player-body { position:absolute; left:27px; top:41px; width:37px; height:49px; border:4px solid var(--ink); border-radius:10px 10px 6px 6px; background:#48a5e8; }
    .player-arm { position:absolute; top:45px; left:19px; width:9px; height:54px; border-radius:9px; background:var(--ink); transform-origin:top center; transform:rotate(54deg); }
    .player-arm.shot { left:59px; top:43px; height:62px; transform:rotate(-139deg); animation:shootArm 1.5s ease-in-out infinite; }
    .player-leg { position:absolute; top:84px; left:34px; width:10px; height:58px; border-radius:9px; background:var(--ink); transform:rotate(8deg); }
    .player-leg.back { left:52px; transform:rotate(-9deg); }
    .player-shoe { position:absolute; bottom:-3px; left:-7px; width:25px; height:10px; border-radius:8px; background:#ff4f9a; }
    .basketball { position:absolute; left:90px; top:48px; width:24px; height:24px; border:2px solid #713d22; border-radius:50%; background:#f18a35; animation:ballArc 2s cubic-bezier(.42,0,.58,1) infinite; }
    .basketball::before,.basketball::after { content:""; position:absolute; inset:0; border-radius:50%; }
    .basketball::before { border-left:2px solid #713d22; transform:rotate(35deg) scaleX(.55); }
    .basketball::after { border-top:2px solid #713d22; transform:rotate(55deg) scaleY(.55); }

  <script>
    const colors = ["#ff4f9a", "#8d5cff", "#ffe46b", "#4dd9c0", "#4dabf7"];
    function confettiBurst() {
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.setProperty("--left", Math.random() * 100 + "vw");
        piece.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
        piece.style.setProperty("--fall", (3 + Math.random() * 3) + "s");
        piece.style.setProperty("--sway", (-80 + Math.random() * 160) + "px");
        piece.style.animationDelay = Math.random() * .7 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 7000);
      }
    }
    confettiBurst();
    setInterval(confettiBurst, 4000);
    document.addEventListener("pointerdown", confettiBurst);
  </script>
